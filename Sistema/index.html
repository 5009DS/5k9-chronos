<!DOCTYPE html>
<html lang="pt-BR" class="ds">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover + as safe-area no CSS: a barra de ação da tela do
         cliente fica colada no rodapé, e sem isso ela some atrás da barra de
         gestos do iPhone — justamente onde ficam "Aprovar" e "Pedir ajuste". -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>5K9 Chronos</title>
    <meta name="description" content="Chronos — cronograma e roteiros de conteúdo do 5K9 Studio.">
    <meta name="theme-color" content="#7F00E1">
    <!-- noindex vale inclusive para a tela do cliente: o link é secreto por
         token, e um cronograma indexado deixa de ser secreto. -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Instrument Sans variável, local. NÃO troque pelo Google Fonts: de lá
         o eixo de largura (wdth) não vem e a voz Condensed do display morre. -->
    <link rel="preload" href="/assets/fonts/InstrumentSans-Variable.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="/assets/fonts.css">

    <!-- Lucide: cópia local, não CDN. O unpkg já falhou em teste no Forms, e
         aqui o prejuízo é maior — a tela sem ícone que gente de fora vê. -->
    <!-- async, e não defer nem nada: são 400 KB. Sem atributo, o navegador
         parava de ler a página até terminar de baixá-los; com defer, o
         sistema inteiro esperava por eles, porque scripts defer rodam ANTES
         dos módulos. Com async a tela monta sem esperar, e quando a
         biblioteca chega ela desenha os ícones que já estão na tela — toda
         tela desenhada depois chama createIcons por conta própria. -->
    <script src="/lucide.min.js" async onload="lucide.createIcons()"></script>

    <!-- A biblioteca do Supabase começa a descer JUNTO com o resto, em vez de
         esperar todo o sistema carregar para ser pedida. Só nas telas da
         equipe: o link do cliente não usa a biblioteca (db/remoto.js).
         O endereço é o mesmo de SUPABASE_JS, em db/remoto.js. -->
    <script>
        if (!/^\/(c|d)\//.test(location.pathname)) {
            var l = document.createElement('link');
            l.rel = 'modulepreload'; l.crossOrigin = 'anonymous';
            l.href = 'https://esm.sh/@supabase/supabase-js@2.117.1/es2022/supabase-js.bundle.mjs';
            document.head.appendChild(l);
        }
    </script>

    <!-- O núcleo que TODA tela usa, pedido de uma vez. Sem esta lista o
         navegador só descobre um arquivo depois de ler o que o importa, e o
         núcleo descia em cinco ondas. É só um aviso: um arquivo que saia da
         lista continua carregando, só que na onda dele. -->
    <link rel="modulepreload" href="/app.js">
    <link rel="modulepreload" href="/store.js">
    <link rel="modulepreload" href="/theme.js">
    <link rel="modulepreload" href="/lib/supabase-config.js">
    <link rel="modulepreload" href="/db/local.js">
    <link rel="modulepreload" href="/db/remoto.js">
    <link rel="modulepreload" href="/lib/diretorio.js">
    <link rel="modulepreload" href="/lib/diretorio-dados.js">
    <link rel="modulepreload" href="/lib/formato.js">
    <link rel="modulepreload" href="/lib/etiquetas.js">
    <link rel="modulepreload" href="/lib/rotas.js">
    <link rel="modulepreload" href="/lib/roteiro.js">
    <link rel="modulepreload" href="/components/pageshell.js">
    <link rel="modulepreload" href="/components/topnav.js">
    <link rel="modulepreload" href="/components/trocador.js">
    <link rel="modulepreload" href="/components/busca.js">
    <link rel="modulepreload" href="/lib/busca.js">
    <link rel="modulepreload" href="/lib/ferramentas.js">
    <link rel="modulepreload" href="/components/menu.js">
    <link rel="modulepreload" href="/components/toast.js">
    <link rel="modulepreload" href="/components/drawer.js">
    <link rel="modulepreload" href="/components/campos.js">
    <link rel="modulepreload" href="/lib/ancorar.js">
    <link rel="modulepreload" href="/lib/pecas.js">
    <link rel="modulepreload" href="/lib/cronograma.js">

    <!-- E a tela do endereço aberto: as telas são baixadas quando abertas
         (app.js), e sem este aviso a da primeira visita só seria pedida depois
         de todo o núcleo rodar. -->
    <script>
        (function () {
            var p = location.pathname, m =
                p === '/' ? 'painel' :
                /^\/quadro\//.test(p) ? 'quadro' :
                /^\/conteudo\//.test(p) ? 'roteiro' :
                /^\/cliente\//.test(p) ? 'cronograma' :
                /^\/producao\//.test(p) ? 'producao' :
                /^\/c\//.test(p) ? 'cliente' :
                /^\/d\//.test(p) ? 'convidado' :
                /^\/login/.test(p) ? 'login' : null;
            if (!m) return;
            var l = document.createElement('link');
            l.rel = 'modulepreload'; l.href = '/pages/' + m + '.js';
            document.head.appendChild(l);
        })();
    </script>

    <!-- Design tokens (base do design system) -->
    <link rel="stylesheet" href="/tokens.css">
    <!-- Tokens da marca 5K9 (ver ds/README-gerado.txt) -->
    <link rel="stylesheet" href="/ds/ds-tokens.scoped.css">
    <!-- Ponte: traduz os nomes semânticos para os tokens da marca -->
    <link rel="stylesheet" href="/tokens-bridge.css">
    <!-- Vocabulário compartilhado das páginas -->
    <link rel="stylesheet" href="/pages/visualizador.css">

    <!-- Aplica o tema salvo antes do render, para não haver flash de branco. -->
    <script>
        (function () {
            try {
                document.documentElement.setAttribute('data-theme',
                    localStorage.getItem('5k9_theme') || 'dark');
            } catch (e) {}
        })();
    </script>

    <style>
        /* Só o mínimo: o resto vem dos tokens. */
        * { box-sizing: border-box; }
        body { margin: 0; display: flex; min-height: 100vh; background: var(--surface-base); }
        #app { display: flex; flex: 1; min-width: 0; }

        .app-aviso {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: var(--space-4);
            padding: var(--space-8); text-align: center;
            font-family: var(--font-sans); color: var(--text-primary);
        }
        .app-aviso h2 { margin: 0; font-size: var(--text-h2); letter-spacing: var(--tracking-tight); }
        .app-aviso p  { margin: 0; font-size: var(--text-sm); color: var(--text-tertiary); max-width: 44ch; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
</body>
</html>
